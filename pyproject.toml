[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-cache-engine"
version = "1.4.1"
description = "Drop-in LLM response cache using ChromaDB vector similarity."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anuj / M4ST" }]
dependencies = [
  "chromadb>=0.5.0",
  "sentence-transformers>=2.2.2",
  "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/m4stanuj/semantic-cache-engine"
Repository = "https://github.com/m4stanuj/semantic-cache-engine"

[tool.setuptools]
py-modules = ["cache", "semantic_cache"]
